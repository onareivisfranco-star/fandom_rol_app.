{% extends "base.html" %}
{% block titulo %}Registro{% endblock %}
{% block content %}
<section class="panel" style="max-width:440px;margin:20px auto">
  <h1 class="titulo-seccion cursivo" style="text-align:center;margin-bottom:6px">Registro exclusivo</h1>
  <p class="suave" style="text-align:center;margin-top:0">Necesitas el código de invitación que dan los admins en el grupo.</p>
  <form method="post" style="display:grid;gap:14px">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div><label class="et" for="username">Nombre de usuario</label>
      <input id="username" class="campo" name="username" required minlength="3" autocomplete="username"></div>
    <div><label class="et" for="password">Contraseña</label>
      <input id="password" class="campo" type="password" name="password" required minlength="6" autocomplete="new-password">
      <div class="ayuda">Mínimo 6 caracteres.</div></div>
    <div><label class="et" for="invite_code">Código de invitación</label>
      <input id="invite_code" class="campo" name="invite_code" required autocomplete="off"></div>
    <button class="btn btn-neon btn-completo">Crear cuenta</button>
  </form>
  <p class="ayuda" style="text-align:center">Un admin aprobará tu cuenta antes de que puedas entrar.</p>
</section>
{% endblock %}
