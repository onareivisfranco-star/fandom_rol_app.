{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block content %}
<section class="panel" style="max-width:440px;margin:20px auto">
  <h1 class="titulo-seccion cursivo" style="text-align:center;margin-bottom:18px">Iniciar sesión</h1>
  <form method="post" style="display:grid;gap:14px">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div><label class="et" for="username">Nombre de usuario</label>
      <input id="username" class="campo" name="username" required autocomplete="username"></div>
    <div><label class="et" for="password">Contraseña</label>
      <input id="password" class="campo" type="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-neon btn-completo">Entrar</button>
  </form>
  <p class="suave" style="text-align:center;margin-bottom:0">¿Primera vez? <a class="underline" href="{{ url_for('register') }}">Regístrate con el código</a></p>
</section>
{% endblock %}
